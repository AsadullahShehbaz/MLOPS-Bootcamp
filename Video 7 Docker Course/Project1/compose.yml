services:
  jupyter:
    image: jupyter/scipy-notebook:latest
    ports:
     - "8888:8888"
    volumes:
      - "./notebooks:/home/jovyan/work"
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.0-full
    ports:
     - "5000:5000"
    environment:
     - MLFLOW_SERVER_ALLOWED_HOST= mlfow:*,localhost:*,127.0.0.1:*
    command: mlflow server --host 0.0.0.0 --port 5000

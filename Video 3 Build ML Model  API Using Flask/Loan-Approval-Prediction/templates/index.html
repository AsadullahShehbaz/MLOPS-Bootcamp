<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Approval Prediction</title>

    <link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Loan Approval Prediction</h1>
        <form action="/predict" method="POST">
            <input type="number" name="no_of_dependents" placeholder="Dependents" required>

            <select name="education" required>
                <option value="Graduate">Graduate</option>
                <option value="Not Graduate">Not Graduate</option>
            </select>

            <select name="self_employed" required>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>

           <input type="number" name="income_annum" placeholder="Annual Income" required>

            <input type="number" name="loan_amount" placeholder="Loan Amount" required>

            <input type="number" name="loan_term" placeholder="Loan Term" required>

            <input type="number" name="cibil_score" placeholder="CIBIL Score" required>

            <input type="number" name="residential_assets_value" placeholder="Residential Assets" required>

            <input type="number" name="commercial_assets_value" placeholder="Commercial Assets" required>

            <input type="number" name="luxury_assets_value" placeholder="Luxury Assets" required>

            <input type="number" name="bank_asset_value" placeholder="Bank Assets" required>

            <button type="submit">Predict</button>
        </form>
        
        {% if prediction %}
        <div class="result">
            Prediction :
            <h2>{{ prediction }}</h2>
        </div>

        {% endif %}

    </div>
</body>
</html>
